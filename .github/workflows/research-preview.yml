name: Research prototype build

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build static website
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production
      - name: Save preview files
        uses: actions/upload-artifact@v4
        with:
          name: research-site-preview
          path: _site/
          retention-days: 14
